name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python3 scripts/validate_skills.py
      - name: Run skill link script offline tests
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Run china-proxy detector offline tests
        run: python3 -B -m unittest discover -s skills/china-proxy/tests -v
      - name: Install meeting audit read-only dependency
        run: pip install -r skills/meeting-reimbursement-audit/requirements.txt
      - name: Run meeting audit synthetic offline tests
        run: python3 -B -m unittest discover -s skills/meeting-reimbursement-audit/tests -v
      - name: Run Baidu Netdisk offline configuration tests
        run: python3 -B -m unittest discover -s skills/baidu-netdisk/tests -v
      - name: Install WeChat bookmark skill dependencies
        run: pip install -r skills/wechat-account-bookmarks/requirements.txt
      - name: Compile WeChat bookmark scripts
        run: python3 -m compileall -q skills/wechat-account-bookmarks/scripts
      - name: Run WeChat bookmark skill tests
        run: python3 -m unittest discover -s skills/wechat-account-bookmarks/tests -v
      - name: Compile WeChat Android shortcut scripts
        run: python3 -m compileall -q skills/wechat-android-shortcuts/scripts
      - name: Run WeChat Android shortcut tests
        run: python3 -m unittest discover -s skills/wechat-android-shortcuts/tests -v
      - name: Install WeChat iOS shortcut dependencies
        run: pip install -r skills/wechat-ios-shortcuts/requirements.txt
      - name: Compile WeChat iOS shortcut scripts
        run: python3 -m compileall -q skills/wechat-ios-shortcuts/scripts
      - name: Run WeChat iOS shortcut tests
        run: python3 -m unittest discover -s skills/wechat-ios-shortcuts/tests -v
      - name: Compile WeChat medical layout adapter
        run: python3 -m compileall -q skills/wechat-medical-writer/scripts
      - name: Run WeChat medical layout adapter tests
        run: python3 -m unittest discover -s skills/wechat-medical-writer/tests -v
